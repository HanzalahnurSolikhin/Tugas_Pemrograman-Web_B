<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pemutar Media Kuliah Responsif</title>

    <link rel="stylesheet" href="03-tugas-style.css">
</head>

<body>

    <main>
        <article class="showcase-card">

            <header class="showcase-card__header">
                <h1 class="showcase-card__title">
                   Video Pembelajaran CSS
                </h1>

                <p class="showcase-card__description">
                    Materi CSS episode 1: Pengenalan CSS
                </p>
            </header>

            <picture class="showcase-card__cover">
                <source
                    srcset="aset/Cover-desktop.webp"
                    media="(min-width: 768px)"
                    type="image/webp">

                <source
                    srcset="aset/Cover-mobile.webp"
                    media="(max-width: 767px)"
                    type="image/webp">

                <img
                    src="aset/Cover-desktop.webp"
                    alt="Cover materi pembelajaran Pemrograman Web">
            </picture>
        </article>
    </main>

</body>
</html>
